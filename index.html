<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05050a">
    <title>NEXUS GENERATOR v5</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05050a; --pnl: #0a0a10; --brd: #1e1e2e; --ph: #d4ff00;
            --txt: #c8c8d8; --mut: #404058; --red: #ff2d1a; --cyn: #00d8cc;
            --amb: #ff9500; --pur: #9955ff; --blu: #3a7fff; --step-h: 22px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--txt); 
            font-family: 'DM Mono', monospace; overflow: hidden;
        }

        #app {
            position: fixed; inset: 0; display: grid;
            grid-template-rows: 44px 1fr auto;
            background: var(--bg);
        }

        /* OVERLAYS */
        .grain {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .scanlines {
            position: fixed; inset: 0; z-index: 9998; pointer-events: none;
            background: repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0.1) 1px, rgba(0,0,0,0) 2px);
        }

        /* HEADER */
        #hdr {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; border-bottom: 1px solid var(--brd); background: var(--pnl);
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--ph); letter-spacing: 1px; }
        .hdr-sep { width: 1px; height: 16px; background: var(--mut); margin: 0 10px; }
        .song-info { flex: 1; display: flex; flex-direction: column; line-height: 1; }
        .song-title { font-weight: 500; font-size: 11px; text-transform: uppercase; }
        .song-sub { font-size: 9px; color: var(--mut); }
        .chips { display: flex; gap: 6px; }
        .chip { 
            font-size: 9px; padding: 2px 6px; border: 1px solid var(--brd); 
            border-radius: 2px; text-transform: uppercase; background: #000;
        }
        #chip-live { color: var(--ph); border-color: var(--ph); }

        /* MAIN */
        #main { display: grid; overflow: hidden; }
        #left-col { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--brd); }
        #video-wrap { position: relative; flex: 1; background: #000; overflow: hidden; }
        #vid-canvas { width: 100%; height: 100%; display: block; }
        .vid-overlay { 
            position: absolute; inset: 0; pointer-events: none; 
            display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
            font-size: 10px; text-shadow: 0 1px 2px #000;
        }
        
        #seq-panel { height: 160px; background: var(--pnl); border-top: 1px solid var(--brd); overflow-y: auto; }
        .seq-row { display: grid; grid-template-columns: 40px 1fr 30px; height: var(--step-h); border-bottom: 1px solid #151520; }
        .seq-label { font-size: 9px; display: flex; align-items: center; justify-content: center; color: var(--mut); border-right: 1px solid var(--brd); }
        .seq-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; padding: 2px; }
        .s-step { background: rgba(255,255,255,0.03); border-radius: 1px; }
        .s-step.on { background: var(--clr); box-shadow: 0 0 8px var(--clr); }
        .s-step.cur { outline: 1px solid var(--ph); z-index: 2; }
        .vu-wrap { background: #000; position: relative; }
        .vu-bar { position: absolute; bottom: 0; width: 100%; background: var(--clr); transition: height 0.1s; opacity: 0.6; }

        /* RIGHT COLUMN (DESKTOP ONLY) */
        #right-col { display: flex; flex-direction: column; width: 280px; background: var(--pnl); }
        #spectrum-wrap { height: 120px; border-bottom: 1px solid var(--brd); position: relative; background: #000; }
        #spec-canvas, #wave-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #structure-panel { flex: 1; padding: 10px; font-size: 10px; display: flex; flex-direction: column; gap: 8px; }
        .struct-item { display: flex; justify-content: space-between; border-bottom: 1px solid var(--brd); padding-bottom: 2px; }
        .chord-row { display: flex; gap: 4px; overflow-x: auto; padding: 5px 0; }
        .chord-chip { padding: 4px 8px; background: var(--brd); border-radius: 2px; font-weight: bold; }

        /* FOOTER */
        #footer { background: var(--pnl); border-top: 1px solid var(--brd); display: flex; flex-direction: column; }
        .footer-row1 { display: flex; height: 50px; align-items: center; padding: 0 10px; gap: 10px; }
        .footer-row2 { display: flex; height: 44px; align-items: center; padding: 0 10px; gap: 15px; border-top: 1px solid var(--brd); }
        
        button { 
            background: var(--brd); color: var(--txt); border: 1px solid #444; 
            font-family: inherit; font-size: 11px; cursor: pointer; touch-action: manipulation;
            display: flex; align-items: center; justify-content: center; border-radius: 2px;
        }
        button:active { background: #333; }
        #gen-btn { height: 34px; padding: 0 20px; background: var(--ph); color: #000; font-family: 'Bebas Neue'; font-size: 16px; border: none; }
        #gen-btn.busy { opacity: 0.5; pointer-events: none; }
        .transport-mini { display: flex; gap: 4px; }
        .t-btn { width: 34px; height: 34px; font-size: 14px; }
        #progress-wrap { flex: 1; height: 4px; background: #000; border-radius: 2px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--ph); transition: width 0.1s; }

        #bpm-control { display: flex; align-items: center; gap: 8px; }
        #bpm-display { font-weight: bold; color: var(--ph); width: 30px; }
        #bpm-slider { -webkit-appearance: none; flex: 1; height: 2px; background: var(--mut); }
        #bpm-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--ph); border-radius: 50%; }

        #midi-row { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
        #midi-btn { height: 28px; padding: 0 8px; gap: 6px; }
        .midi-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mut); }
        #midi-btn.connected .midi-dot { background: var(--cyn); box-shadow: 0 0 5px var(--cyn); }
        #midi-btn.error .midi-dot { background: var(--red); }
        #tempo-toggle { height: 28px; width: 40px; }
        #midi-device-name { font-size: 9px; color: var(--mut); max-width: 80px; overflow: hidden; white-space: nowrap; }

        /* LOADING */
        #loading { 
            position: fixed; inset: 0; z-index: 10000; background: var(--bg); 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
        }
        #loading.show { display: flex; }
        .ld-title { font-family: 'Bebas Neue'; font-size: 32px; color: var(--ph); margin-bottom: 20px; }
        .ld-steps { font-size: 10px; color: var(--mut); margin-bottom: 10px; text-align: center; height: 14px; }
        .ld-bar-wrap { width: 200px; height: 2px; background: var(--brd); }
        .ld-bar { width: 0%; height: 100%; background: var(--ph); }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            #right-col { display: none; }
            #main { grid-template-columns: 1fr; }
            #seq-panel { height: 130px; }
            #footer { height: auto; }
            .footer-row1, .footer-row2 { width: 100%; }
            #gen-btn { flex: 1; }
        }
        @media (min-width: 701px) {
            #main { grid-template-columns: 1fr 280px; }
            .footer-row1 { flex: 1; }
        }
    </style>
</head>
<body>

<div class="grain"></div>
<div class="scanlines"></div>

<div id="app">
    <header id="hdr">
        <div style="display: flex; align-items: center;">
            <div class="logo">NEXUS GEN v5</div>
            <div class="hdr-sep"></div>
            <div class="song-info">
                <div class="song-title" id="ui-title">IDLE_SYSTEM</div>
                <div class="song-sub" id="ui-sub">Awaiting initialization...</div>
            </div>
        </div>
        <div class="chips">
            <div class="chip" id="chip-key">C MIN</div>
            <div class="chip" id="chip-style">HYBRID</div>
            <div class="chip" id="chip-live">IDLE</div>
        </div>
    </header>

    <div id="main">
        <div id="left-col">
            <div id="video-wrap">
                <canvas id="vid-canvas"></canvas>
                <div class="vid-overlay">
                    <div style="display: flex; justify-content: space-between;">
                        <span id="vid-chord">----</span>
                        <span id="vid-time">00:00:00</span>
                    </div>
                    <div style="text-align: right; color: var(--ph); font-family: 'Bebas Neue'; font-size: 18px;" id="vid-bpm">120 BPM</div>
                </div>
            </div>
            <div id="seq-panel" id="seq-container">
                </div>
        </div>
        <div id="right-col">
            <div id="spectrum-wrap">
                <canvas id="spec-canvas"></canvas>
                <canvas id="wave-canvas"></canvas>
            </div>
            <div id="structure-panel">
                <div class="struct-item"><span>SECTION</span><span id="ui-section">-</span></div>
                <div class="struct-item"><span>MOOD</span><span id="ui-mood">-</span></div>
                <div class="chord-row" id="ui-chords"></div>
                <div style="flex:1"></div>
                <div style="font-size: 8px; color: var(--mut);">MASTER COMPRESSOR: ACTIVE</div>
            </div>
        </div>
    </div>

    <footer id="footer">
        <div class="footer-row1">
            <button id="gen-btn"><span id="gen-txt">GENERATE</span></button>
            <div class="transport-mini">
                <button class="t-btn" id="t-stop">■</button>
                <button class="t-btn" id="t-play">▶</button>
            </div>
            <div id="progress-wrap"><div id="progress-fill"></div></div>
        </div>
        <div class="footer-row2">
            <div id="bpm-control">
                <label style="font-size: 9px; color: var(--mut);">BPM</label>
                <div id="bpm-display">120</div>
                <input type="range" id="bpm-slider" min="60" max="180" value="120" step="1">
            </div>
            <div id="midi-row">
                <button id="midi-btn"><div class="midi-dot"></div>MIDI</button>
                <button id="tempo-toggle">
                    <span id="lbl-int">INT</span>
                    <span id="lbl-ext" style="display:none">EXT</span>
                </button>
                <div id="midi-device-name">NO DEVICE</div>
            </div>
        </div>
    </footer>
</div>

<div id="loading">
    <div class="ld-title">GENERATING</div>
    <div id="ld-steps" class="ld-steps">Initializing Audio Engine...</div>
    <div class="ld-bar-wrap"><div id="ld-bar" class="ld-bar"></div></div>
</div>

<script>
/**
 * NEXUS GENERATOR v5
 * Autonome Musik-Engine IIFE
 */
const G = (() => {
    'use strict';

    // --- VARIABLEN ---
    let ctx = null, mGain = null, mComp = null, limiter = null;
    let bassEQ = null, hiCut = null, analyser = null;
    let reverbConv = null, revSend = null, delayN = null, delFeed = null, delSend = null;
    
    let song = null, playing = false, genCount = 0;
    let songTime = 0, lastTs = 0, nextSchedTime = 0, schedStep = 0;
    let vidRAF = null, vizRAF = null, seqTimer = null;
    let bpmOverride = null;
    let isGenerating = false;
    let drumBuffers = {};
    const SR = 44100;
    
    // MIDI
    let midiAccess = null, midiOut = null;
    let midiConnected = false, midiClockMode = 'int';
    let midiClockTimer = null;
    const PPQN = 24;
    const MIDI_CH = 9;
    const MIDI_NOTES = { kick:36, snare:38, clap:39, hihat:42, openhat:46, perc:43 };

    const STYLES = [
        { name: 'LOFI HIP HOP', bpm: [72, 92], swing: 55, dVol: 0.92, bVol: 0.82, mVol: 0.20, pVol: 0.22, vibe: '#ff9500' },
        { name: 'DARK TECHNO', bpm: [128, 145], swing: 0, dVol: 0.95, bVol: 0.88, mVol: 0.14, pVol: 0.12, vibe: '#3a7fff' },
        { name: 'BOOM BAP', bpm: [85, 100], swing: 60, dVol: 0.92, bVol: 0.85, mVol: 0.22, pVol: 0.18, vibe: '#ff2d1a' },
        { name: 'MINIMAL TECH', bpm: [120, 134], swing: 5, dVol: 0.90, bVol: 0.85, mVol: 0.12, pVol: 0.10, vibe: '#00d8cc' },
        { name: 'JAZZY LOFI', bpm: [68, 88], swing: 65, dVol: 0.85, bVol: 0.78, mVol: 0.25, pVol: 0.20, vibe: '#9955ff' },
        { name: 'INDUSTRIAL', bpm: [136, 152], swing: 10, dVol: 0.95, bVol: 0.85, mVol: 0.12, pVol: 0.10, vibe: '#404058' }
    ];

    const SCALES = {
        'Minor Pent': { steps:[0,3,5,7,10], mood:'dark' },
        'Nat Minor': { steps:[0,2,3,5,7,8,10], mood:'dark' },
        'Dorian': { steps:[0,2,3,5,7,9,10], mood:'cool' },
        'Phrygian': { steps:[0,1,3,5,7,8,10], mood:'tense' },
        'Blues': { steps:[0,3,5,6,7,10], mood:'gritty' },
        'Harmonic Min': { steps:[0,2,3,5,7,8,11], mood:'dark' }
    };

    const drumVolMult = { kick:1.0, snare:0.88, clap:0.75, hihat:0.45, openhat:0.40, perc:0.35 };

    // --- MATH & UTILS ---
    function mkRNG(seed) {
        let s = (seed >>> 0) || 1;
        return () => { 
            s += 0x6d2b79f5; 
            let t = Math.imul(s ^ s>>>15, 1|s); 
            t ^= t + Math.imul(t ^ t>>>7, 61|t); 
            return ((t ^ t>>>14) >>> 0) / 4294967296; 
        };
    }
    const rInt = (min, max, R) => Math.floor(R() * (max - min + 1)) + min;
    const rPick = (arr, R) => arr[Math.floor(R() * arr.length)];

    // --- DSP HELPERS ---
    const wNoise = (n) => { let a = new Float32Array(n); for(let i=0;i<n;i++) a[i]=Math.random()*2-1; return a; };
    const envExp = (n, tau) => { let a = new Float32Array(n); for(let i=0;i<n;i++) a[i]=Math.exp(-i/tau); return a; };
    const lerp = (v0, v1, t) => v0*(1-t)+v1*t;
    const pitchSweep = (n, f0, f1) => { 
        let a = new Float32Array(n), ph = 0; 
        for(let i=0;i<n;i++) { 
            let f = lerp(f0, f1, i/n); ph += 2*Math.PI*f/SR; a[i] = Math.sin(ph); 
        } 
        return a; 
    };
    const biquadLP = (src, f, q) => {
        let out = new Float32Array(src.length), w0 = 2*Math.PI*f/SR, alpha = Math.sin(w0)/(2*q);
        let b1 = 1-Math.cos(w0), b0 = b1/2, b2 = b0, a0 = 1+alpha, a1 = -2*Math.cos(w0), a2 = 1-alpha;
        let x1=0, x2=0, y1=0, y2=0;
        for(let i=0;i<src.length;i++){
            let y = (b0*src[i] + b1*x1 + b2*x2 - a1*y1 - a2*y2)/a0;
            out[i] = y; x2=x1; x1=src[i]; y2=y1; y1=y;
        }
        return out;
    };
    const biquadBP = (src, f, q) => {
        let out = new Float32Array(src.length), w0 = 2*Math.PI*f/SR, alpha = Math.sin(w0)/(2*q);
        let b0 = alpha, b1 = 0, b2 = -alpha, a0 = 1+alpha, a1 = -2*Math.cos(w0), a2 = 1-alpha;
        let x1=0, x2=0, y1=0, y2=0;
        for(let i=0;i<src.length;i++){
            let y = (b0*src[i] + b1*x1 + b2*x2 - a1*y1 - a2*y2)/a0;
            out[i] = y; x2=x1; x1=src[i]; y2=y1; y1=y;
        }
        return out;
    };
    const sat = (src, amt) => { for(let i=0;i<src.length;i++) src[i] = Math.tanh(src[i]*amt); return src; };
    const norm = (src) => { 
        let max = 0; for(let i=0;i<src.length;i++) max = Math.max(max, Math.abs(src[i]));
        if(max>0) for(let i=0;i<src.length;i++) src[i]/=max; return src; 
    };
    const mixN = (...args) => {
        let len = args[0].length, out = new Float32Array(len);
        for(let i=0; i<args.length; i+=2) {
            let buf = args[i], vol = args[i+1];
            for(let j=0; j<len; j++) out[j] += buf[j] * vol;
        }
        return out;
    };

    // --- DRUM SYNTHS ---
    function dspKick(tune=1, decay=0.5, punch=0.6, dist=0.2) {
        const n = Math.floor(SR * 0.8);
        const sub = pitchSweep(n, 120*tune, 28*tune);
        const sEnv = envExp(n, decay*600);
        for(let i=0;i<n;i++) sub[i] *= sEnv[i];
        const sub2 = new Float32Array(n);
        for(let i=0;i<n;i++) sub2[i] = Math.sin(2*Math.PI*50*tune*i/SR)*Math.exp(-i/(SR*0.2));
        const subF = sat(biquadLP(sub, 100+tune*20, 0.9), 1.0+dist*1.5);
        const click = biquadBP(wNoise(n), 2000+punch*1200, 1.2);
        const cEnv = envExp(n, 4);
        for(let i=0;i<n;i++) click[i] *= cEnv[i] * (0.1+punch*0.2);
        return norm(mixN(subF,1.0, sub2,0.6, click,0.8));
    }

    function dspSnare() {
        const n = Math.floor(SR * 0.5);
        const body = pitchSweep(n, 220, 180);
        const bEnv = envExp(n, 40);
        for(let i=0;i<n;i++) body[i] *= bEnv[i];
        const noise = biquadBP(wNoise(n), 1200, 0.5);
        const nEnv = envExp(n, 120);
        for(let i=0;i<n;i++) noise[i] *= nEnv[i] * 0.8;
        return norm(mixN(body, 0.5, noise, 0.5));
    }

    function dspHat(open=false) {
        const n = Math.floor(SR * (open ? 0.4 : 0.05));
        let noise = wNoise(n);
        noise = biquadBP(noise, 8000, 1.5);
        const env = envExp(n, open ? 800 : 100);
        for(let i=0;i<n;i++) noise[i] *= env[i];
        return norm(noise);
    }

    // --- AUDIO ENGINE INIT ---
    function initAudio() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        mComp = ctx.createDynamicsCompressor();
        mComp.threshold.value = -14; mComp.ratio.value = 5;
        
        bassEQ = ctx.createBiquadFilter();
        bassEQ.type = 'lowshelf'; bassEQ.frequency.value = 120; bassEQ.gain.value = 4.5;
        
        hiCut = ctx.createBiquadFilter();
        hiCut.type = 'highshelf'; hiCut.frequency.value = 8000; hiCut.gain.value = -3.5;
        
        limiter = ctx.createDynamicsCompressor();
        limiter.threshold.value = -1; limiter.ratio.value = 20;
        
        mGain = ctx.createGain(); mGain.gain.value = 0.78;
        analyser = ctx.createAnalyser(); analyser.fftSize = 512;
        
        mComp.connect(bassEQ); bassEQ.connect(hiCut); hiCut.connect(limiter);
        limiter.connect(mGain); mGain.connect(ctx.destination); mGain.connect(analyser);
        
        // Effects
        revSend = ctx.createGain(); revSend.gain.value = 0.15;
        reverbConv = ctx.createConvolver();
        // Mock IR
        let ir = ctx.createBuffer(2, SR*2, SR);
        for(let c=0;c<2;c++) { let d = ir.getChannelData(c); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/4000); }
        reverbConv.buffer = ir;
        revSend.connect(reverbConv); reverbConv.connect(mGain);
    }

    function toBuffer(floatArr) {
        let b = ctx.createBuffer(1, floatArr.length, SR);
        b.getChannelData(0).set(floatArr);
        return b;
    }

    // --- GENERATE ---
    async function generate() {
        if (isGenerating) return;
        isGenerating = true;
        const btn = document.getElementById('gen-btn');
        const txt = document.getElementById('gen-txt');
        const ld = document.getElementById('loading');
        const ldBar = document.getElementById('ld-bar');
        const ldStep = document.getElementById('ld-steps');

        try {
            stop();
            initAudio();
            if (ctx.state === 'suspended') await ctx.resume();
            
            btn.classList.add('busy'); txt.textContent = 'RENDERING…';
            ld.classList.add('show');

            const updateLD = (p, s) => { ldBar.style.width = p+'%'; ldStep.textContent = s; };

            updateLD(10, "Synthesizing Drums...");
            drumBuffers.kick = toBuffer(dspKick());
            drumBuffers.snare = toBuffer(dspSnare());
            drumBuffers.clap = toBuffer(dspSnare());
            drumBuffers.hihat = toBuffer(dspHat(false));
            drumBuffers.openhat = toBuffer(dspHat(true));
            drumBuffers.perc = toBuffer(dspHat(false));

            updateLD(30, "Defining Song Structure...");
            const R = mkRNG(Date.now());
            const style = rPick(STYLES, R);
            const scaleKey = rPick(Object.keys(SCALES), R);
            const scale = SCALES[scaleKey];
            const root = rPick([48, 50, 52, 53, 55, 57, 45, 43], R); // C to G bass
            const bpm = bpmOverride || rInt(style.bpm[0], style.bpm[1], R);

            // Patterns & Progression
            const progression = [[1, 6, 4, 5], [1, 4, 1, 5], [1, 5, 6, 4]][rInt(0, 2, R)];
            
            song = {
                style, bpm, scale, root, progression,
                chords: progression.map(deg => {
                    const idx = deg - 1;
                    return [root + scale.steps[idx % scale.steps.length], root + scale.steps[(idx+2) % scale.steps.length], root + scale.steps[(idx+4) % scale.steps.length]];
                }),
                patterns: {
                    kick: Array.from({length: 16}, (_, i) => i % 8 === 0 || (i===10 && R()>0.5) ? 1 : 0),
                    snare: Array.from({length: 16}, (_, i) => i === 4 || i === 12 ? 1 : 0),
                    hihat: Array.from({length: 16}, (_, i) => 1),
                    bass: Array.from({length: 16}, () => R() > 0.6 ? 1 : 0)
                }
            };

            updateLD(70, "Finalizing UI...");
            document.getElementById('ui-title').textContent = `SONG_${Date.now().toString(16).toUpperCase()}`;
            document.getElementById('ui-sub').textContent = `${style.name} // SEED:${Math.floor(R()*10000)}`;
            document.getElementById('chip-key').textContent = `${['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][root%12]} ${scale.mood.toUpperCase()}`;
            document.getElementById('chip-style').textContent = style.name;
            document.getElementById('bpm-display').textContent = bpm;
            document.getElementById('bpm-slider').value = bpm;
            document.getElementById('vid-bpm').textContent = `${bpm} BPM`;

            buildSequencerUI();
            
            updateLD(100, "Ready.");
            setTimeout(() => { ld.classList.remove('show'); playPause(); }, 500);

        } catch (err) {
            console.error(err);
        } finally {
            btn.classList.remove('busy');
            txt.textContent = 'GENERATE';
            isGenerating = false;
        }
    }

    // --- SEQUENCER & SCHEDULER ---
    function schedulerTick() {
        while (nextSchedTime < ctx.currentTime + 0.1) {
            scheduleStep(schedStep, nextSchedTime);
            nextStep();
        }
    }

    function scheduleStep(step, time) {
        const beatDuration = 60 / song.bpm;
        const stepDuration = beatDuration / 4;
        let actualTime = time;

        // Swing
        if (step % 2 !== 0 && song.style.swing > 0) {
            actualTime += (song.style.swing / 200) * stepDuration;
        }

        // Play Audio
        Object.keys(song.patterns).forEach(key => {
            if (song.patterns[key] && song.patterns[key][step]) {
                if (drumBuffers[key]) playDrum(key, actualTime);
                if (midiConnected) midiDrumStep(key, actualTime);
            }
        });

        // Bass Logic
        if (song.patterns.bass[step]) {
            const chord = song.chords[Math.floor(step/4) % 4];
            playSynth(chord[0] - 12, actualTime, stepDuration * 0.8, 'bass');
        }

        // UI Update (Visuals)
        const delay = (actualTime - ctx.currentTime) * 1000;
        setTimeout(() => {
            if (!playing) return;
            const steps = document.querySelectorAll(`.s-step[data-step="${step}"]`);
            document.querySelectorAll('.s-step.cur').forEach(s => s.classList.remove('cur'));
            steps.forEach(s => s.classList.add('cur'));
            
            document.getElementById('vid-chord').textContent = ['I','ii','iii','IV','V','vi','vii'][song.progression[Math.floor(step/4)%4]-1];
            document.getElementById('progress-fill').style.width = `${(step/15)*100}%`;
        }, Math.max(0, delay));
    }

    function nextStep() {
        const beatDuration = 60 / song.bpm;
        nextSchedTime += beatDuration / 4;
        schedStep = (schedStep + 1) % 16;
    }

    function playDrum(key, when) {
        const s = ctx.createBufferSource();
        s.buffer = drumBuffers[key];
        const g = ctx.createGain();
        g.gain.value = song.style.dVol * (drumVolMult[key] || 1);
        s.connect(g); g.connect(mComp);
        s.start(when);
    }

    function playSynth(note, when, dur, type) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        const freq = 440 * Math.pow(2, (note - 69) / 12);
        
        osc.frequency.value = freq;
        osc.type = type === 'bass' ? 'sawtooth' : 'sine';
        
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(type==='bass'?0.3:0.1, when + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, when + dur);
        
        const filter = ctx.createBiquadFilter();
        filter.frequency.value = type === 'bass' ? 400 : 2000;

        osc.connect(filter); filter.connect(g); g.connect(mComp);
        osc.start(when); osc.stop(when + dur);
    }

    // --- MIDI ---
    async function connectMidi() {
        const btn = document.getElementById('midi-btn');
        try {
            midiAccess = await navigator.requestMIDIAccess();
            const outputs = Array.from(midiAccess.outputs.values());
            if (outputs.length > 0) {
                midiOut = outputs.find(o => o.name.toLowerCase().includes('tr')) || outputs[0];
                midiConnected = true;
                btn.classList.add('connected');
                document.getElementById('midi-device-name').textContent = midiOut.name.toUpperCase();
            }
        } catch(e) {
            btn.classList.add('error');
        }
    }

    function midiDrumStep(drumKey, when) {
        if (!midiConnected || !midiOut) return;
        const note = MIDI_NOTES[drumKey];
        if (note === undefined) return;
        const delayMs = Math.max(0, (when - ctx.currentTime) * 1000);
        setTimeout(() => {
            try {
                midiOut.send([0x90 | MIDI_CH, note, 100]);
                setTimeout(() => midiOut.send([0x80 | MIDI_CH, note, 0]), 20);
            } catch(e) {}
        }, delayMs);
    }

    // --- UI & VIDEO ---
    function buildSequencerUI() {
        const container = document.getElementById('seq-panel');
        container.innerHTML = '';
        const tracks = [
            {id:'kick', label:'KCK', clr:'var(--ph)'},
            {id:'snare', label:'SNR', clr:'var(--red)'},
            {id:'clap', label:'CLP', clr:'var(--amb)'},
            {id:'hihat', label:'HHT', clr:'var(--blu)'},
            {id:'openhat', label:'OHT', clr:'var(--cyn)'},
            {id:'perc', label:'PRC', clr:'var(--pur)'}
        ];

        tracks.forEach(t => {
            const row = document.createElement('div');
            row.className = 'seq-row';
            row.innerHTML = `<div class="seq-label">${t.label}</div><div class="seq-grid" id="grid-${t.id}"></div><div class="vu-wrap"><div class="vu-bar" style="--clr:${t.clr}"></div></div>`;
            container.appendChild(row);
            const grid = row.querySelector('.seq-grid');
            for(let i=0; i<16; i++) {
                const step = document.createElement('div');
                step.className = 's-step';
                step.dataset.step = i;
                step.style.setProperty('--clr', t.clr);
                if (song.patterns[t.id] && song.patterns[t.id][i]) step.classList.add('on');
                grid.appendChild(step);
            }
        });
    }

    function draw() {
        vizRAF = requestAnimationFrame(draw);
        const canvas = document.getElementById('vid-canvas');
        if (!canvas) return;
        const vctx = canvas.getContext('2d');
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;

        // Reactive Background
        const vibe = song ? song.style.vibe : '#05050a';
        vctx.fillStyle = '#05050a';
        vctx.fillRect(0,0,w,h);

        // Grid
        vctx.strokeStyle = vibe;
        vctx.globalAlpha = 0.1;
        vctx.beginPath();
        for(let i=0; i<w; i+=40) { vctx.moveTo(i,0); vctx.lineTo(i,h); }
        for(let i=0; i<h; i+=40) { vctx.moveTo(0,i); vctx.lineTo(w,i); }
        vctx.stroke();

        // Waveform
        if (analyser) {
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteTimeDomainData(data);
            vctx.globalAlpha = 0.8;
            vctx.strokeStyle = vibe;
            vctx.lineWidth = 2;
            vctx.beginPath();
            for(let i=0; i<data.length; i++) {
                const x = (i / data.length) * w;
                const y = (data[i] / 255) * h;
                if(i===0) vctx.moveTo(x,y); else vctx.lineTo(x,y);
            }
            vctx.stroke();
        }
        
        // Timecode
        if (playing) {
            const now = Date.now();
            if(!lastTs) lastTs = now;
            songTime += (now - lastTs);
            lastTs = now;
            const ms = Math.floor(songTime % 1000 / 10).toString().padStart(2,'0');
            const sec = Math.floor(songTime / 1000 % 60).toString().padStart(2,'0');
            const min = Math.floor(songTime / 60000).toString().padStart(2,'0');
            document.getElementById('vid-time').textContent = `${min}:${sec}:${ms}`;
        }
    }

    // --- TRANSPORT ---
    function playPause() {
        if (!song) { generate(); return; }
        if (playing) {
            playing = false;
            clearInterval(seqTimer);
            document.getElementById('chip-live').textContent = 'PAUSED';
        } else {
            playing = true;
            lastTs = Date.now();
            nextSchedTime = ctx.currentTime + 0.05;
            seqTimer = setInterval(schedulerTick, 18);
            document.getElementById('chip-live').textContent = 'LIVE';
        }
    }

    function stop() {
        playing = false;
        clearInterval(seqTimer);
        songTime = 0; lastTs = 0; schedStep = 0;
        document.getElementById('chip-live').textContent = 'IDLE';
        document.getElementById('progress-fill').style.width = '0%';
        document.querySelectorAll('.s-step.cur').forEach(s => s.classList.remove('cur'));
    }

    // --- INITIALIZATION ---
    function addBtn(id, fn) {
        const el = document.getElementById(id);
        if (!el) return;
        let touched = false;
        el.addEventListener('touchstart', e => { e.preventDefault(); touched = true; fn(); }, { passive: false });
        el.addEventListener('click', () => { if (touched) { touched = false; return; } fn(); });
    }

    function init() {
        addBtn('gen-btn', generate);
        addBtn('t-play', playPause);
        addBtn('t-stop', stop);
        addBtn('midi-btn', connectMidi);
        
        document.getElementById('bpm-slider').addEventListener('input', (e) => {
            bpmOverride = parseInt(e.target.value);
            document.getElementById('bpm-display').textContent = bpmOverride;
            if (song) song.bpm = bpmOverride;
        });

        draw();
    }

    window.addEventListener('load', init);

    return { generate, playPause, stop };
})();
</script>
</body>
</html>
